name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Show files
        run: find . -maxdepth 3 -not -path './.git/*' | sort
      - name: Build
        run: |
          F=$(find . -maxdepth 4 -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then echo "::error::앱 코드 파일이 저장소에 없어요. 압축 푼 폴더 안의 파일을 전부 올려 주세요."; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TabiCamera-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
